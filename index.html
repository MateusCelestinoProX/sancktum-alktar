<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SANCKTUM ALKTAR</title>
  
  <meta name="description" content="Sancktum Alktar — Altar Digital & Energizador de Sigilos em Puro Vidro e Magia.">
  <meta name="theme-color" content="#040406">
  
  <!-- Estilos Críticos Inlined para Garantia de Cache Zero e Renderização Imediata -->
  <link rel="stylesheet" href="assets/css/styles.css?v=2.2">
  <link rel="icon" type="image/png" href="assets/images/sigils/sancktum_alktar_sigil.png">

  <style>
    /* Inlined Critical Styles to guarantee instant layout & zero cache failures */
    :root {
      --bg-obsidian: #040406;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: 1px solid rgba(255, 255, 255, 0.14);
      --glass-blur: blur(28px) saturate(160%);
      --text-pure: #ffffff;
      --text-silver: #e2e8f0;
      --font-sacred: 'Cinzel', serif;
    }

    #altar-stage-container {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      overflow: hidden;
      z-index: 10;
      pointer-events: none;
    }

    .sigils-overlay-layer {
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      z-index: 5;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: min(80vw, 400px) !important;
      height: min(80vw, 400px) !important;
      aspect-ratio: 1 / 1 !important;
      pointer-events: none;
    }

    .sancktum-sigil-halo {
      position: relative !important;
      width: 100% !important;
      height: 100% !important;
      border-radius: 50% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.015) 60%, transparent 80%) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      box-shadow: inset 0 0 50px rgba(255, 255, 255, 0.03), 0 0 80px rgba(0, 0, 0, 0.6) !important;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: auto;
    }

    .central-sacred-sigil {
      max-width: 62% !important;
      max-height: 78% !important;
      object-fit: contain !important;
      margin: auto !important;
      display: block !important;
      filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.85)) drop-shadow(0 0 38px rgba(220, 230, 255, 0.45));
    }

    .glass-fullscreen-btn {
      position: fixed !important;
      top: 1.5rem !important;
      right: 1.5rem !important;
      z-index: 1000 !important;
      display: inline-flex !important;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 1.15rem;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 9999px;
      color: #e2e8f0;
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      pointer-events: auto !important;
    }

    .altar-dock {
      position: fixed !important;
      bottom: 2.2rem !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      z-index: 1000 !important;
      display: flex !important;
      align-items: center !important;
      gap: 0.85rem !important;
      padding: 0.55rem 0.95rem !important;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      border-radius: 9999px;
      pointer-events: auto !important;
    }

    .glass-dock-btn {
      background: transparent;
      border: none;
      outline: none;
      color: #e2e8f0;
      font-family: 'Cinzel', serif;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 0.65rem 1.45rem;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto !important;
      transition: all 0.25s ease;
    }

    .glass-dock-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
    }

    .glass-modal-backdrop {
      position: fixed !important;
      inset: 0 !important;
      z-index: 9000 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      background: rgba(2, 2, 5, 0.75) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      transition: opacity 0.3s ease, visibility 0.3s ease !important;
    }

    .glass-modal-backdrop.active {
      opacity: 1 !important;
      visibility: visible !important;
      pointer-events: all !important;
    }
  </style>
</head>
<body>

  <!-- ===================================================================
       HERO CINEMÁTICO: TRANSIÇÃO DE ENTRADA AO RECARREGAR
       =================================================================== -->
  <div id="cinematic-hero">
    <div class="hero-content">
      <div class="hero-crest-line"></div>
      <h1 class="hero-title">SANCKTUM ALKTAR</h1>
      <p class="hero-subtitle">Altar & Vontade Sagrada</p>
      <div class="hero-crest-line"></div>
    </div>
  </div>

  <!-- ===================================================================
       BOTÃO DE TELA CHEIA (SUPERIOR DIREITO)
       =================================================================== -->
  <button type="button" class="glass-fullscreen-btn" id="btn-fullscreen-top" onclick="window.toggleAltarFullscreen()" title="Alternar Tela Cheia">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
    </svg>
    <span>Tela Cheia</span>
  </button>

  <!-- ===================================================================
       PALCO PRINCIPAL / ALTAR DO SIGILO CENTRAL (MATEMATICAMENTE CENTRALIZADO)
       =================================================================== -->
  <main id="altar-stage-container">
    <!-- Camada de Vídeo Hipnótico (YouTube Portals) -->
    <iframe id="hypnotic-yt-iframe" class="hypnotic-yt-iframe" allow="autoplay"></iframe>

    <!-- Camada de Shaders WebGL Canvas -->
    <canvas id="hypnotic-stage-canvas" class="hypnotic-canvas"></canvas>

    <!-- Camada do Sigilo Sagrado Central (Pre-renderizado no centro absoluto) -->
    <div class="sigils-overlay-layer" id="sigils-overlay-layer">
      <div class="sancktum-sigil-halo">
        <img class="central-sacred-sigil" id="altar-main-sigil" src="assets/images/sigils/sancktum_alktar_sigil.png" alt="Sancktum Alktar" title="Sancktum Alktar">
      </div>
    </div>
  </main>

  <!-- ===================================================================
       DOCK FLUTUANTE EM VIDRO LÍQUIDO (ESTRITAMENTE 2 BOTÕES)
       =================================================================== -->
  <nav class="altar-dock" aria-label="Navegação do Altar">
    <button type="button" class="glass-dock-btn" id="dock-btn-energizer" onclick="window.openAltarModal('modal-energizer')">
      Energizador
    </button>

    <div class="dock-divider"></div>

    <button type="button" class="glass-dock-btn" id="dock-btn-backgrounds" onclick="window.openAltarModal('modal-backgrounds')">
      Backgrounds
    </button>
  </nav>

  <!-- ===================================================================
       PAGE / MODAL: ENERGIZADOR DE SIGILOS
       =================================================================== -->
  <div class="glass-modal-backdrop" id="modal-energizer" aria-hidden="true" onclick="window.handleModalBackdropClick(event, 'modal-energizer')">
    <div class="glass-modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 class="modal-title">Energizador de Sigilos</h2>
        <button type="button" class="modal-close-btn" onclick="window.closeAllAltarModals()" title="Fechar">✕</button>
      </div>

      <!-- Botão de Ação Principal -->
      <div class="setting-group">
        <button type="button" class="glass-action-btn primary-highlight" id="toggle-charge-btn">
          Iniciar Energização
        </button>
      </div>

      <!-- Padrão Hipnótico -->
      <div class="setting-group">
        <div class="setting-label-row">
          <label class="setting-title" for="hypnotic-pattern-select">Padrão Hipnótico de Transe</label>
        </div>
        <select class="glass-select-input" id="hypnotic-pattern-select">
          <optgroup label="Shaders WebGL">
            <option value="balatro">Balatro Esotérico</option>
            <option value="ferrofluid">Ferrofluido Quântico</option>
            <option value="metaballs">MetaBolas Alquímicas</option>
            <option value="plasma">Plasma Astral</option>
            <option value="splashcursor">Fluido Interativo</option>
            <option value="prismaticburst">Dispersão Prismática</option>
          </optgroup>
          <optgroup label="Portais Hipnóticos">
            <option value="yt_1">Portal Geométrico I</option>
            <option value="yt_2">Vórtice Hipnótico II</option>
            <option value="yt_3">Ondas Quânticas III</option>
            <option value="yt_4">Geometria Sagrada IV</option>
            <option value="yt_5">Portal de Luz V</option>
            <option value="yt_6">Transe Ectoplasmático VI</option>
            <option value="yt_7">Vórtice Astral VII</option>
            <option value="yt_8">Freqüência Cósmica VIII</option>
            <option value="yt_9">Fluxo Infinito IX</option>
          </optgroup>
        </select>
      </div>

      <!-- Upload de Sigilo Customizado -->
      <div class="setting-group">
        <div class="setting-label-row">
          <span class="setting-title">Purificação de Sigilo Próprio</span>
        </div>
        <div class="sigil-upload-box" id="sigil-dropzone">
          <div class="upload-hint-title">Arraste ou Clique para Enviar</div>
          <p class="upload-hint-sub">PNG, JPG ou SVG. O fundo é isolado automaticamente para brilhar em vidro no Altar.</p>
          <input type="file" id="sigil-file-input" accept="image/*" style="display: none;">
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="glass-action-btn" id="reset-sigil-btn">
          Restaurar Sigilo Sancktum Alktar
        </button>
      </div>
    </div>
  </div>

  <!-- ===================================================================
       PAGE / MODAL: BACKGROUNDS & ATMOSFERA
       =================================================================== -->
  <div class="glass-modal-backdrop" id="modal-backgrounds" aria-hidden="true" onclick="window.handleModalBackdropClick(event, 'modal-backgrounds')">
    <div class="glass-modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 class="modal-title">Backgrounds & Atmosfera</h2>
        <button type="button" class="modal-close-btn" onclick="window.closeAllAltarModals()" title="Fechar">✕</button>
      </div>

      <!-- Categoria de Fundo -->
      <div class="setting-group">
        <div class="setting-label-row">
          <label class="setting-title" for="bg-category-select">Atmosfera de Fundo</label>
        </div>
        <select class="glass-select-input" id="bg-category-select">
          <option value="caosphere">Caosfera</option>
          <option value="celestial">Celestial</option>
          <option value="horror">Abissal</option>
          <option value="satanic">Arcano</option>
        </select>
      </div>

      <!-- Escurecimento -->
      <div class="setting-group">
        <div class="setting-label-row">
          <span class="setting-title">Escurecimento</span>
          <span class="setting-val" id="bg-dim-val">52%</span>
        </div>
        <input type="range" class="glass-range-slider" id="bg-dim-slider" min="0.1" max="0.9" step="0.05" value="0.52">
      </div>

      <!-- Desfoque / Blur -->
      <div class="setting-group">
        <div class="setting-label-row">
          <span class="setting-title">Desfoque Óptico</span>
          <span class="setting-val" id="bg-blur-val">0px</span>
        </div>
        <input type="range" class="glass-range-slider" id="bg-blur-slider" min="0" max="20" step="1" value="0">
      </div>
    </div>
  </div>

  <!-- Funções Globais Imediatas dos Modais (Imunes a atrasos de script) -->
  <script>
    window.openAltarModal = function(modalId) {
      window.closeAllAltarModals();
      const m = document.getElementById(modalId);
      if (m) {
        m.classList.add('active');
        m.setAttribute('aria-hidden', 'false');
      }
    };

    window.closeAllAltarModals = function() {
      const modals = document.querySelectorAll('.glass-modal-backdrop');
      modals.forEach(m => {
        m.classList.remove('active');
        m.setAttribute('aria-hidden', 'true');
      });
    };

    window.handleModalBackdropClick = function(event, modalId) {
      if (event.target && event.target.id === modalId) {
        window.closeAllAltarModals();
      }
    };

    window.toggleAltarFullscreen = function() {
      try {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen();
          } else if (document.documentElement.webkitRequestFullscreen) {
            document.documentElement.webkitRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        }
      } catch (e) {
        console.warn('Fullscreen não suportado ou negado:', e);
      }
    };

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') window.closeAllAltarModals();
    });
  </script>

  <!-- Scripts do Motor do Altar -->
  <script src="assets/js/hypnotic_canvas.js?v=2.2"></script>
  <script src="assets/js/background_engine.js?v=2.2"></script>
  <script src="assets/js/sigil_charger.js?v=2.2"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Inicializar o Energizador de Sigilos
      try {
        window.sigilChargerEngine = new SigilChargerEngine();
      } catch (err) {
        console.warn('Erro ao inicializar SigilChargerEngine:', err);
      }

      // 2. Transição Cinemática do Hero ao Recarregar
      const hero = document.getElementById('cinematic-hero');
      if (hero) {
        setTimeout(() => {
          hero.classList.add('fade-out');
          setTimeout(() => {
            hero.style.display = 'none';
          }, 1400);
        }, 2200);
      }
    });
  </script>
</body>
</html>

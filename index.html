<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SANCKTUM ALKTAR</title>
  
  <meta name="description" content="Sancktum Alktar — Altar Digital & Energizador de Sigilos em Puro Vidro e Magia.">
  <meta name="theme-color" content="#040406">
  
  <!-- Estilos Liquid Glass & Magia -->
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" type="image/png" href="assets/images/sigils/sancktum_alktar_sigil.png">
</head>
<body>

  <!-- ===================================================================
       HERO CINEMÁTICO: TRANSIÇÃO DE ENTRADA AO RECARREGAR
       =================================================================== -->
  <div id="cinematic-hero">
    <div class="hero-content">
      <div class="hero-crest-line"></div>
      <h1 class="hero-title">SANCKTUM ALKTAR</h1>
      <p class="hero-subtitle">Altar & Vontade Sagrada</p>
      <div class="hero-crest-line"></div>
    </div>
  </div>

  <!-- ===================================================================
       BOTÃO DE TELA CHEIA (SUPERIOR DIREITO)
       =================================================================== -->
  <button type="button" class="glass-fullscreen-btn" id="btn-fullscreen-top" title="Alternar Tela Cheia">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
    </svg>
    <span>Tela Cheia</span>
  </button>

  <!-- ===================================================================
       PALCO PRINCIPAL / ALTAR DO SIGILO CENTRAL
       =================================================================== -->
  <main id="altar-stage-container">
    <!-- Camada de Vídeo Hipnótico (YouTube Portals) -->
    <iframe id="hypnotic-yt-iframe" class="hypnotic-yt-iframe" allow="autoplay"></iframe>

    <!-- Camada de Shaders WebGL Canvas -->
    <canvas id="hypnotic-stage-canvas" class="hypnotic-canvas"></canvas>

    <!-- Camada do Sigilo Sagrado Central -->
    <div class="sigils-overlay-layer" id="sigils-overlay-layer"></div>
  </main>

  <!-- ===================================================================
       DOCK FLUTUANTE EM VIDRO LÍQUIDO (ESTRITAMENTE 2 BOTÕES)
       =================================================================== -->
  <nav class="altar-dock" aria-label="Navegação do Altar">
    <button type="button" class="glass-dock-btn" id="dock-btn-energizer">
      Energizador
    </button>

    <div class="dock-divider"></div>

    <button type="button" class="glass-dock-btn" id="dock-btn-backgrounds">
      Backgrounds
    </button>
  </nav>

  <!-- ===================================================================
       PAGE / MODAL: ENERGIZADOR DE SIGILOS
       =================================================================== -->
  <div class="glass-modal-backdrop" id="modal-energizer" aria-hidden="true">
    <div class="glass-modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Energizador de Sigilos</h2>
        <button type="button" class="modal-close-btn" id="close-energizer-btn" title="Fechar">✕</button>
      </div>

      <!-- Botão de Ação Principal -->
      <div class="setting-group">
        <button type="button" class="glass-action-btn primary-highlight" id="toggle-charge-btn">
          Iniciar Energização
        </button>
      </div>

      <!-- Padrão Hipnótico -->
      <div class="setting-group">
        <div class="setting-label-row">
          <label class="setting-title" for="hypnotic-pattern-select">Padrão Hipnótico de Transe</label>
        </div>
        <select class="glass-select-input" id="hypnotic-pattern-select">
          <optgroup label="Shaders WebGL">
            <option value="balatro">Balatro Esotérico</option>
            <option value="ferrofluid">Ferrofluido Quântico</option>
            <option value="metaballs">MetaBolas Alquímicas</option>
            <option value="plasma">Plasma Astral</option>
            <option value="splashcursor">Fluido Interativo</option>
            <option value="prismaticburst">Dispersão Prismática</option>
          </optgroup>
          <optgroup label="Portais Hipnóticos">
            <option value="yt_1">Portal Geométrico I</option>
            <option value="yt_2">Vórtice Hipnótico II</option>
            <option value="yt_3">Ondas Quânticas III</option>
            <option value="yt_4">Geometria Sagrada IV</option>
            <option value="yt_5">Portal de Luz V</option>
            <option value="yt_6">Transe Ectoplasmático VI</option>
            <option value="yt_7">Vórtice Astral VII</option>
            <option value="yt_8">Freqüência Cósmica VIII</option>
            <option value="yt_9">Fluxo Infinito IX</option>
          </optgroup>
        </select>
      </div>

      <!-- Upload de Sigilo Customizado -->
      <div class="setting-group">
        <div class="setting-label-row">
          <span class="setting-title">Purificação de Sigilo Próprio</span>
        </div>
        <div class="sigil-upload-box" id="sigil-dropzone">
          <div class="upload-hint-title">Arraste ou Clique para Enviar</div>
          <p class="upload-hint-sub">PNG, JPG ou SVG. O fundo é isolado automaticamente para brilhar em vidro no Altar.</p>
          <input type="file" id="sigil-file-input" accept="image/*" style="display: none;">
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="glass-action-btn" id="reset-sigil-btn">
          Restaurar Sigilo Sancktum Alktar
        </button>
      </div>
    </div>
  </div>

  <!-- ===================================================================
       PAGE / MODAL: BACKGROUNDS & ATMOSFERA
       =================================================================== -->
  <div class="glass-modal-backdrop" id="modal-backgrounds" aria-hidden="true">
    <div class="glass-modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Backgrounds & Atmosfera</h2>
        <button type="button" class="modal-close-btn" id="close-backgrounds-btn" title="Fechar">✕</button>
      </div>

      <!-- Categoria de Fundo -->
      <div class="setting-group">
        <div class="setting-label-row">
          <label class="setting-title" for="bg-category-select">Atmosfera de Fundo</label>
        </div>
        <select class="glass-select-input" id="bg-category-select">
          <option value="caosphere">Caosfera</option>
          <option value="celestial">Celestial</option>
          <option value="horror">Abissal</option>
          <option value="satanic">Arcano</option>
        </select>
      </div>

      <!-- Escurecimento -->
      <div class="setting-group">
        <div class="setting-label-row">
          <span class="setting-title">Escurecimento</span>
          <span class="setting-val" id="bg-dim-val">52%</span>
        </div>
        <input type="range" class="glass-range-slider" id="bg-dim-slider" min="0.1" max="0.9" step="0.05" value="0.52">
      </div>

      <!-- Desfoque / Blur -->
      <div class="setting-group">
        <div class="setting-label-row">
          <span class="setting-title">Desfoque Óptico</span>
          <span class="setting-val" id="bg-blur-val">0px</span>
        </div>
        <input type="range" class="glass-range-slider" id="bg-blur-slider" min="0" max="20" step="1" value="0">
      </div>
    </div>
  </div>

  <!-- Scripts do Motor do Altar -->
  <script src="assets/js/hypnotic_canvas.js"></script>
  <script src="assets/js/background_engine.js"></script>
  <script src="assets/js/sigil_charger.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Inicializar o Energizador de Sigilos
      window.sigilChargerEngine = new SigilChargerEngine();

      // 2. Transição Cinemática do Hero ao Recarregar
      const hero = document.getElementById('cinematic-hero');
      if (hero) {
        setTimeout(() => {
          hero.classList.add('fade-out');
          setTimeout(() => {
            hero.style.display = 'none';
          }, 1400);
        }, 2200);
      }

      // 3. Modais do Dock
      const modalEnergizer = document.getElementById('modal-energizer');
      const modalBackgrounds = document.getElementById('modal-backgrounds');

      const btnEnergizer = document.getElementById('dock-btn-energizer');
      const btnBackgrounds = document.getElementById('dock-btn-backgrounds');

      const closeEnergizerBtn = document.getElementById('close-energizer-btn');
      const closeBackgroundsBtn = document.getElementById('close-backgrounds-btn');

      const openModal = (modal) => {
        closeAllModals();
        if (modal) {
          modal.classList.add('active');
          modal.setAttribute('aria-hidden', 'false');
        }
      };

      const closeAllModals = () => {
        [modalEnergizer, modalBackgrounds].forEach(m => {
          if (m) {
            m.classList.remove('active');
            m.setAttribute('aria-hidden', 'true');
          }
        });
      };

      if (btnEnergizer) {
        btnEnergizer.addEventListener('click', () => openModal(modalEnergizer));
      }

      if (btnBackgrounds) {
        btnBackgrounds.addEventListener('click', () => openModal(modalBackgrounds));
      }

      if (closeEnergizerBtn) {
        closeEnergizerBtn.addEventListener('click', closeAllModals);
      }

      if (closeBackgroundsBtn) {
        closeBackgroundsBtn.addEventListener('click', closeAllModals);
      }

      [modalEnergizer, modalBackgrounds].forEach(m => {
        if (m) {
          m.addEventListener('click', (e) => {
            if (e.target === m) closeAllModals();
          });
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeAllModals();
      });
    });
  </script>
</body>
</html>
